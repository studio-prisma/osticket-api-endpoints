openapi: 3.1.0
info:
  title: osTicket API Endpoints
  version: 2.3.2
  description: |
    Extended REST API for osTicket, provided by the **API Endpoints Plugin**.

    Extends the built-in osTicket API with:
    - **Ticket CRUD** – Create, retrieve, update, delete tickets
    - **Search** – Filter by status, department, query string with pagination
    - **Statistics** – Global counts, department & staff breakdowns
    - **Subticket Management** – Parent/child relationships (requires Subticket Manager Plugin)
    - **Attachment Download** – Download ticket attachments as Base64-encoded content

    ## Authentication

    All endpoints require an **API Key** sent via the `X-API-Key` header.
    Each key has granular permissions configured in the osTicket Admin Panel.

    ## Response Formats

    Most GET endpoints support `.json` and `.xml` via the URL extension.
  contact:
    name: Markus Michalski
    url: https://github.com/markus-michalski/osticket-api-endpoints
  license:
    name: GPL-2.0
    url: https://opensource.org/licenses/GPL-2.0

servers:
  - url: /api
    description: Relative to osTicket installation

tags:
  - name: Ticket Management
    description: Create, retrieve, update, delete, and search tickets
  - name: Statistics
    description: Ticket statistics and status lookups
  - name: Subticket Management
    description: |
      Parent-child ticket relationships.
      Requires **Subticket Manager Plugin** to be installed and active.
  - name: Attachments
    description: Download ticket attachment content
  - name: Task Management
    description: |
      Read, search, create, update and delete osTicket tasks, standalone or
      linked to a ticket. Each operation has its own API key permission.
      Changes run as the agent set in "Tasks as Agent"; osTicket applies that
      agent's role in the task's department, like in the staff UI.
  - name: Knowledge Base
    description: |
      FAQ categories and articles: list, search, read, create and change,
      including internal/public/featured. There is no delete. Reading needs
      `can_read_kb`, changes need `can_write_kb`.

security:
  - ApiKeyAuth: []

paths:
  # ===========================================================================
  # Ticket Management
  # ===========================================================================

  /tickets.json:
    post:
      operationId: createTicket
      summary: Create a new ticket
      description: |
        Create a new ticket with optional extended parameters including Markdown
        formatting, department routing, subticket linking, and file attachments.

        The response is the **ticket number as plain text** (not JSON).
      tags:
        - Ticket Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket created successfully
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - '781258'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /tickets-get.php/{number}.{format}:
    get:
      operationId: getTicket
      summary: Retrieve a single ticket
      description: |
        Get full ticket details including all thread entries (messages, responses, notes).

        Lookup logic: tries `lookupByNumber()` first, then falls back to `lookup()` (by ID).
      tags:
        - Ticket Management
      parameters:
        - $ref: '#/components/parameters/ticketNumber'
        - $ref: '#/components/parameters/responseFormat'
      responses:
        '200':
          description: Ticket details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets-update.php/{number}.{format}:
    patch:
      operationId: updateTicket
      summary: Update a ticket
      description: |
        Update ticket properties such as subject, status, department, priority,
        SLA, staff assignment, due date, and add internal notes with attachments.

        Also accepts `PUT` method.

        The response is the **ticket number as plain text** (not JSON).
      tags:
        - Ticket Management
      parameters:
        - $ref: '#/components/parameters/ticketNumber'
        - $ref: '#/components/parameters/responseFormat'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          description: Ticket updated successfully
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - '781258'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets-reply.php/{number}.{format}:
    post:
      operationId: replyToTicket
      summary: Reply to the customer
      description: |
        Post a public reply. Unlike the internal note of `tickets-update.php`,
        the customer sees it, and osTicket emails it to the recipients unless
        `alert` is `false`. A sent email cannot be recalled.

        Requires the `can_reply_tickets` permission, which `can_update_tickets`
        does not imply, and the "Reply as Agent" plugin setting. The reply is
        posted as that agent: the agent must be active and allowed to reply in
        the ticket's department. API replies never assign the ticket.

        Markdown is not accepted. Use `text` (line breaks are kept) or `html`.
      tags:
        - Ticket Management
      parameters:
        - $ref: '#/components/parameters/ticketNumber'
        - $ref: '#/components/parameters/responseFormat'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyTicketRequest'
      responses:
        '200':
          description: Reply posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplyTicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No reply agent configured, agent inactive, or agent not allowed to reply to this ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets-search.php:
    get:
      operationId: searchTickets
      summary: Search tickets
      description: |
        Search tickets by query string, status, department, and other filters.
        Supports pagination and sorting.

        Returns a **direct JSON array** (not wrapped in an object).

        Search results do **not** include thread entries (performance optimization).
      tags:
        - Ticket Management
      parameters:
        - name: query
          in: query
          description: Search in ticket subject (case-insensitive)
          schema:
            type: string
        - name: status
          in: query
          description: Filter by status name or ID
          schema:
            oneOf:
              - type: string
              - type: integer
            examples:
              - 'Open'
              - 1
        - name: department
          in: query
          description: |
            Filter by department name, ID, or path.
            Path format: `Parent / Child` for nested departments.
          schema:
            oneOf:
              - type: string
              - type: integer
            examples:
              - 'Support'
              - 'Dev / osTicket'
              - 5
        - name: limit
          in: query
          description: Maximum results per page (default 20, max 100)
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Pagination offset
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: sort
          in: query
          description: Sort field
          schema:
            type: string
            enum:
              - created
              - updated
              - number
            default: created
      responses:
        '200':
          description: Array of matching tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tickets-delete.php/{number}.{format}:
    delete:
      operationId: deleteTicket
      summary: Delete a ticket permanently
      description: |
        Permanently delete a ticket and all associated data (thread entries, attachments).

        **This action is irreversible!**

        The `can_delete_tickets` permission is **disabled by default** on all API keys.

        The response is the **deleted ticket number as plain text** (not JSON).
      tags:
        - Ticket Management
      parameters:
        - $ref: '#/components/parameters/ticketNumber'
        - $ref: '#/components/parameters/responseFormat'
      responses:
        '200':
          description: Ticket deleted successfully
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - '781258'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # Statistics
  # ===========================================================================

  /tickets-stats.php:
    get:
      operationId: getTicketStats
      summary: Get ticket statistics
      description: |
        Retrieve comprehensive ticket statistics including global counts,
        department breakdown, and staff performance metrics.
      tags:
        - Statistics
      responses:
        '200':
          description: Ticket statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tickets-statuses.php:
    get:
      operationId: listStatuses
      summary: List all ticket statuses
      description: |
        Retrieve all available ticket statuses with their IDs, names, and states.
        Useful for dynamically looking up status IDs by name.
      tags:
        - Statistics
      responses:
        '200':
          description: Array of ticket statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ===========================================================================
  # Subticket Management
  # ===========================================================================

  /tickets-subtickets-parent.php/{number}.{format}:
    get:
      operationId: getParentTicket
      summary: Get parent ticket
      description: |
        Retrieve the parent ticket of a child ticket (subticket).
        Returns `{"parent": null}` if the ticket has no parent.
      tags:
        - Subticket Management
      parameters:
        - name: number
          in: path
          required: true
          description: Child ticket number
          schema:
            type: string
        - $ref: '#/components/parameters/responseFormat'
      responses:
        '200':
          description: Parent ticket or null
          content:
            application/json:
              schema:
                type: object
                required:
                  - parent
                properties:
                  parent:
                    oneOf:
                      - $ref: '#/components/schemas/SubticketInfo'
                      - type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /tickets-subtickets-list.php/{number}.{format}:
    get:
      operationId: getChildTickets
      summary: Get child tickets
      description: |
        Retrieve all child tickets (subtickets) of a parent ticket.
        Returns `{"children": []}` if no subtickets exist.
        Only returns direct children (no grandchildren).
      tags:
        - Subticket Management
      parameters:
        - name: number
          in: path
          required: true
          description: Parent ticket number
          schema:
            type: string
        - $ref: '#/components/parameters/responseFormat'
      responses:
        '200':
          description: Array of child tickets
          content:
            application/json:
              schema:
                type: object
                required:
                  - children
                properties:
                  children:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubticketInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /tickets-subtickets-create.php/{parentNumber}.{format}:
    post:
      operationId: createSubticketLink
      summary: Create subticket link
      description: |
        Create a parent-child relationship between two existing tickets.

        Validations:
        1. Parent and child are not the same ticket
        2. Parent ticket exists
        3. Child ticket exists
        4. API key has department access to both tickets
        5. Child does not already have a parent

        Uses HTTP 422 (not 409) for duplicate relationships because osTicket's
        `Http::response()` does not support 409.
      tags:
        - Subticket Management
      parameters:
        - name: parentNumber
          in: path
          required: true
          description: Parent ticket number
          schema:
            type: string
        - $ref: '#/components/parameters/responseFormat'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - childId
              properties:
                childId:
                  type: string
                  description: Child ticket number
                  examples:
                    - '781259'
      responses:
        '200':
          description: Subticket link created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  message:
                    type: string
                  parent:
                    $ref: '#/components/schemas/SubticketInfo'
                  child:
                    $ref: '#/components/schemas/SubticketInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Child already has a parent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /tickets-subtickets-unlink.php/{number}.{format}:
    delete:
      operationId: unlinkSubticket
      summary: Unlink subticket
      description: |
        Remove the parent-child relationship of a child ticket, making it
        a standalone ticket again.

        This is safe and reversible — tickets can be re-linked using the create endpoint.
      tags:
        - Subticket Management
      parameters:
        - name: number
          in: path
          required: true
          description: Child ticket number to unlink
          schema:
            type: string
        - $ref: '#/components/parameters/responseFormat'
      responses:
        '200':
          description: Subticket unlinked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  message:
                    type: string
                  child:
                    $ref: '#/components/schemas/SubticketInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'

  # ===========================================================================
  # Attachments
  # ===========================================================================

  /tickets-attachment-download.php/{file_id}.{format}:
    get:
      operationId: downloadAttachment
      summary: Download a ticket attachment
      description: |
        Download a ticket attachment by file ID. Returns file metadata and
        Base64-encoded file content.

        **Security:** The endpoint verifies that the file ID belongs to a ticket
        attachment (via `ost_ticket_attachment` table) before serving content.
        Arbitrary `ost_file` access is not possible.

        **File size:** Suitable for files up to ~10 MB. For very large files,
        consider downloading directly from the osTicket web interface.

        **Finding file IDs:** Use the [GET Retrieve Ticket](#getTicket) endpoint —
        thread entries with attachments include an `attachments` array containing
        `file_id` for each attached file.
      tags:
        - Attachments
      parameters:
        - name: file_id
          in: path
          required: true
          description: File ID from the `attachments` array in a thread entry
          schema:
            type: integer
            minimum: 1
          examples:
            byId:
              value: 29
              summary: File ID from thread entry attachment metadata
        - $ref: '#/components/parameters/responseFormat'
      responses:
        '200':
          description: Attachment content with metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentDownloadResponse'
        '400':
          description: Invalid file ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: File not linked to a ticket attachment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: File not found in ost_file table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to read file content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ===========================================================================
  # Task Management
  # ===========================================================================

  /tickets-tasks-get.php/{number}.{format}:
    get:
      operationId: getTask
      summary: Get a task with its thread
      description: |
        Returns the task with description (`M`), internal notes (`N`) and
        updates (`R`). Requires `can_read_tasks`.
      tags:
        - Task Management
      parameters:
        - $ref: '#/components/parameters/taskNumber'
        - $ref: '#/components/parameters/responseFormat'
      responses:
        '200':
          description: Task found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets-tasks-search.php:
    get:
      operationId: searchTasks
      summary: Search tasks
      description: |
        Lists tasks, newest first by default. Requires `can_search_tasks`
        (or `can_read_tasks`).
      tags:
        - Task Management
      parameters:
        - name: ticket
          in: query
          description: Only tasks linked to this ticket number
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed, all]
            default: open
        - name: departmentId
          in: query
          description: Department ID or name
          schema:
            type: string
        - name: staffId
          in: query
          description: Assigned agent (ID, username or email)
          schema:
            type: string
        - name: teamId
          in: query
          description: Assigned team (ID or name)
          schema:
            type: string
        - name: unassigned
          in: query
          schema:
            type: boolean
        - name: overdue
          in: query
          schema:
            type: boolean
        - name: standalone
          in: query
          description: Only tasks without ticket (ignored when `ticket` is set)
          schema:
            type: boolean
        - name: query
          in: query
          description: Task number prefix or text in the title (max. 100 characters)
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: sort
          in: query
          schema:
            type: string
            enum: [created, updated, duedate, number]
            default: created
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Matching tasks (without thread)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets-tasks-create.php:
    post:
      operationId: createTask
      summary: Create a task
      description: |
        Creates a task, standalone or linked to a ticket, as the "Tasks as
        Agent". osTicket sends its usual new-task and assignment alerts to
        agents. Linking to a ticket adds an internal note there.

        Requires `can_create_tasks` and the "Tasks as Agent" setting. The
        agent needs the task-create permission in the department (and the
        assign permission when `staffId`/`teamId` is set).
      tags:
        - Task Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TaskAgentForbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets-tasks-update.php/{number}.{format}:
    patch:
      operationId: updateTask
      summary: Update a task
      description: |
        Changes a task as the "Tasks as Agent". All fields are optional.
        Every input and every permission is checked before the first change
        is written. Unchanged values are skipped; `changed` lists what was
        applied.

        Role permissions per action: title, ticket link and due date need
        edit, `departmentId` transfer, `staffId`/`teamId`/`unassign` assign,
        `status` close, `response` reply. Notes need access to the task only.

        Requires `can_update_tasks` and the "Tasks as Agent" setting.
      tags:
        - Task Management
      parameters:
        - $ref: '#/components/parameters/taskNumber'
        - $ref: '#/components/parameters/responseFormat'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TaskDetail'
                  - type: object
                    properties:
                      changed:
                        type: array
                        items:
                          type: string
                          enum: [title, ticket, dueDate, departmentId, assign, unassign, status, note, response]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TaskAgentForbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets-tasks-delete.php/{number}.{format}:
    delete:
      operationId: deleteTask
      summary: Delete a task
      description: |
        Deletes the task with its thread and form data as the "Tasks as
        Agent". A linked ticket gets an internal note. Requires
        `can_delete_tasks`, the "Tasks as Agent" setting and the task-delete
        permission of the agent's role.
      tags:
        - Task Management
      parameters:
        - $ref: '#/components/parameters/taskNumber'
        - $ref: '#/components/parameters/responseFormat'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comments:
                  type: string
                  description: Reason, written to the system log
      responses:
        '200':
          description: Task deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  number:
                    type: string
                  title:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TaskAgentForbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # Knowledge Base
  # ===========================================================================

  /kb-categories-list.php:
    get:
      operationId: listKbCategories
      summary: List FAQ categories
      description: All categories with parent, visibility and article count. Requires `can_read_kb`.
      tags:
        - Knowledge Base
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/KbCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /kb-categories-create.php:
    post:
      operationId: createKbCategory
      summary: Create an FAQ category
      description: |
        Creates a category through osTicket's `Category::update()` (same
        validation and HTML sanitizing as the staff UI). Internal unless
        `visibility` is set. Requires `can_write_kb`.
      tags:
        - Knowledge Base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KbCategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /kb-categories-update.php/{id}.{format}:
    patch:
      operationId: updateKbCategory
      summary: Change an FAQ category
      description: |
        Fields left out keep their value. A category cannot become its own
        parent or move below one of its subcategories. Nothing is deleted.
        Requires `can_write_kb`.
      tags:
        - Knowledge Base
      parameters:
        - $ref: '#/components/parameters/kbId'
        - $ref: '#/components/parameters/responseFormat'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KbCategoryRequest'
      responses:
        '200':
          description: Category changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /kb-faq-search.php:
    get:
      operationId: searchKbArticles
      summary: Search FAQ articles
      description: |
        Newest change first. Text search covers title and answer. `slug`
        finds the article behind a friendly URL. Requires `can_read_kb`.
      tags:
        - Knowledge Base
      parameters:
        - name: query
          in: query
          schema:
            type: string
            maxLength: 200
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: visibility
          in: query
          schema:
            type: string
            enum: [internal, public, featured]
        - name: slug
          in: query
          schema:
            type: string
            pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Matching articles (without answer)
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  articles:
                    type: array
                    items:
                      $ref: '#/components/schemas/KbArticle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /kb-faq-get.php/{id}.{format}:
    get:
      operationId: getKbArticle
      summary: Get an FAQ article
      description: Article with answer (HTML), notes and help topics. Requires `can_read_kb`.
      tags:
        - Knowledge Base
      parameters:
        - $ref: '#/components/parameters/kbId'
        - $ref: '#/components/parameters/responseFormat'
      responses:
        '200':
          description: Article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbArticleDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /kb-faq-create.php:
    post:
      operationId: createKbArticle
      summary: Create an FAQ article
      description: |
        Creates an article through osTicket's `FAQ::update()`: the answer is
        sanitized like in the staff UI, tags are stripped from the title,
        duplicate titles are refused. Internal unless `visibility` is set.
        Requires `can_write_kb`.
      tags:
        - Knowledge Base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/KbArticleRequest'
                - required: [question, answer, categoryId]
      responses:
        '201':
          description: Article created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbArticleDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /kb-faq-update.php/{id}.{format}:
    patch:
      operationId: updateKbArticle
      summary: Change an FAQ article
      description: |
        Fields left out keep their value; linked help topics and attachments
        stay. `visibility: internal` hides an article from the portal. There
        is no delete. Requires `can_write_kb`.
      tags:
        - Knowledge Base
      parameters:
        - $ref: '#/components/parameters/kbId'
        - $ref: '#/components/parameters/responseFormat'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KbArticleRequest'
      responses:
        '200':
          description: Article changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbArticleDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

# =============================================================================
# Components
# =============================================================================

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: osTicket API key with appropriate permissions

  parameters:
    ticketNumber:
      name: number
      in: path
      required: true
      description: Ticket number or internal ticket ID
      schema:
        type: string
      examples:
        byNumber:
          value: '781258'
          summary: By ticket number
        byId:
          value: '123'
          summary: By internal ID

    taskNumber:
      name: number
      in: path
      required: true
      description: Task number as shown in osTicket
      schema:
        type: string
        pattern: '^[A-Za-z0-9-]{1,20}$'

    kbId:
      name: id
      in: path
      required: true
      description: Article or category ID
      schema:
        type: integer
        minimum: 1

    responseFormat:
      name: format
      in: path
      required: true
      description: Response format
      schema:
        type: string
        enum:
          - json
          - xml

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: API key lacks required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TaskAgentForbidden:
      description: |
        No "Tasks as Agent" configured, agent inactive, or the agent's role
        lacks the permission for this action or access to the task/ticket
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotImplemented:
      description: Feature/Plugin not available (e.g., Subticket Manager Plugin not installed)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # =========================================================================
    # Error
    # =========================================================================

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: boolean
          const: true
        message:
          type: string
          description: Human-readable error description

    # =========================================================================
    # Ticket Create / Update
    # =========================================================================

    CreateTicketRequest:
      type: object
      required:
        - name
        - email
        - subject
        - message
      properties:
        name:
          type: string
          description: User's full name
          examples:
            - 'John Doe'
        email:
          type: string
          format: email
          description: User's email address
        subject:
          type: string
          description: Ticket subject
        message:
          type: string
          description: Ticket message body
        phone:
          type: string
          description: User's phone number
        ip:
          type: string
          description: Client IP address
        source:
          type: string
          description: Ticket source
          examples:
            - 'API'
            - 'Web'
            - 'Email'
        format:
          type: string
          enum:
            - text
            - html
            - markdown
          default: text
          description: |
            Message format. `markdown` requires the Markdown Support Plugin
            to be installed (otherwise returns 501).
        departmentId:
          oneOf:
            - type: string
            - type: integer
          description: Department name (case-insensitive) or ID
        parentTicketId:
          oneOf:
            - type: string
            - type: integer
          description: Parent ticket number or ID (creates as subticket)
        topicId:
          type: integer
          description: Help Topic ID
        priority:
          oneOf:
            - type: string
            - type: integer
          description: Priority name or ID
        duedate:
          type: string
          format: date
          description: Due date (ISO 8601)
        autorespond:
          type: boolean
          default: true
          description: Send auto-response email to user
        attachments:
          type: array
          description: |
            File attachments as Base64 data-URI objects.
            Max 5 files, 10 MB each.
          maxItems: 5
          items:
            type: object
            description: Object with filename as key and data-URI as value
            additionalProperties:
              type: string
          examples:
            - - screenshot.png: 'data:image/png;base64,iVBORw0KGgo...'

    UpdateTicketRequest:
      type: object
      properties:
        subject:
          type: string
          description: |
            New ticket subject. Trimmed; must be a non-empty single line of
            plain text (no HTML, no control characters) within the length
            configured on the ticket form's subject field (255 if none).
            Validated before any other change. The change is logged as an
            "edited" thread event with the old and the new subject.
          examples:
            - 'Printer on 2nd floor offline'
        statusId:
          oneOf:
            - type: string
            - type: integer
          description: Status name (case-insensitive) or ID
          examples:
            - 'Resolved'
            - 3
        feedback:
          type: boolean
          description: |
            Only with statusId. Passed to the Feedback plugin
            (studio-prisma/osticket-plugin-feedback 0.2+) as
            $_POST['feedback_ask'] while the status changes: true asks the
            customer the satisfaction question (if the plugin's rules allow
            it), false switches it off for this ticket. Left out, the
            plugin's setting for closes without an agent form decides.
            Invalid values are refused with 400 before any change.
          examples:
            - true
        departmentId:
          oneOf:
            - type: string
            - type: integer
          description: Department name (case-insensitive) or ID
        topicId:
          type: integer
          description: Help Topic ID
        slaId:
          oneOf:
            - type: string
            - type: integer
          description: SLA Plan name (case-insensitive) or ID
        staffId:
          oneOf:
            - type: string
            - type: integer
          description: Staff username or ID
        priorityId:
          oneOf:
            - type: string
            - type: integer
          description: Priority name (case-insensitive, e.g. `High`) or ID
          examples:
            - 'High'
            - 4
        priority:
          oneOf:
            - type: string
            - type: integer
          description: Alias for `priorityId`. Ignored when `priorityId` is set.
        dueDate:
          type:
            - string
            - 'null'
          format: date
          description: Due date (ISO 8601). Set to `null` to clear.
        parentTicketNumber:
          type: string
          description: Parent ticket number (makes this a subticket)
        note:
          type: string
          description: Internal note (visible to staff only)
        noteTitle:
          type: string
          default: API Update
          description: Title for the internal note
        noteFormat:
          type: string
          enum:
            - markdown
            - html
            - text
          default: markdown
          description: Format for the note
        attachments:
          type: array
          description: |
            File attachments for the note (requires `note` field).
            Max 5 files, 10 MB each.
          maxItems: 5
          items:
            type: object
            additionalProperties:
              type: string

    ReplyTicketRequest:
      type: object
      required:
        - response
      properties:
        response:
          type: string
          maxLength: 65535
          description: Reply text (at most 65535 bytes)
        format:
          type: string
          enum: [text, html]
          default: text
        replyTo:
          type: string
          enum: [all, user]
          default: all
          description: '`all` = owner and active collaborators, `user` = owner only'
        signature:
          type: string
          enum: [mine, dept, none]
          default: mine
          description: Signature of the reply agent, of the department, or none
        alert:
          type: boolean
          default: true
          description: Send the reply email. `false` posts the reply without email.

    ReplyTicketResponse:
      type: object
      properties:
        ticket:
          type: string
          examples:
            - '781258'
        entryId:
          type: integer
          description: ID of the new thread entry
        alerted:
          type: boolean
        replyTo:
          type: string
        agent:
          type: string
          description: Name of the agent the reply was posted as

    # =========================================================================
    # Ticket Response Objects
    # =========================================================================

    TicketDetail:
      type: object
      description: Full ticket details including thread entries
      properties:
        id:
          type: integer
          description: Internal database ID
        number:
          type: string
          description: Public ticket number
        subject:
          type: string
        statusId:
          type: integer
        status:
          type: string
        priorityId:
          type: integer
        priority:
          type: string
        departmentId:
          type: integer
        department:
          type:
            - string
            - 'null'
        topicId:
          type: integer
        topic:
          type:
            - string
            - 'null'
        userId:
          type: integer
        user:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
              format: email
        staffId:
          type:
            - integer
            - 'null'
        staff:
          type:
            - string
            - 'null'
        teamId:
          type:
            - integer
            - 'null'
        team:
          type:
            - string
            - 'null'
        slaId:
          type:
            - integer
            - 'null'
        sla:
          type:
            - string
            - 'null'
        created:
          type: string
          description: Creation timestamp
        updated:
          type:
            - string
            - 'null'
          description: Last update timestamp
        duedate:
          type:
            - string
            - 'null'
          description: Due date
        closed:
          type:
            - string
            - 'null'
          description: Close date (null if not closed)
        isOverdue:
          type: boolean
        isAnswered:
          type: boolean
        source:
          type: string
        ip:
          type:
            - string
            - 'null'
        children:
          type: array
          description: Internal database IDs of child tickets (not ticket numbers)
          items:
            type: integer
        thread:
          type: array
          items:
            $ref: '#/components/schemas/ThreadEntry'

    ThreadEntry:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum:
            - message
            - response
            - note
          description: |
            `message` = user message,
            `response` = staff response,
            `note` = internal note (staff only)
        poster:
          type: string
        timestamp:
          type: string
        body:
          type: string
        staffId:
          type: integer
          description: Present on staff responses and notes
        staff:
          type: string
          description: Staff name (present on staff responses and notes)
        userId:
          type: integer
          description: Present on user messages
        attachments:
          type: array
          description: |
            Attachment metadata (only present when thread entry has attachments).
            Use `file_id` to download content via the attachment download endpoint.
          items:
            $ref: '#/components/schemas/AttachmentMetadata'
        attachment_count:
          type: integer
          description: Number of attachments (only present when thread entry has attachments)

    TicketSummary:
      type: object
      description: Ticket summary (without thread entries)
      properties:
        id:
          type: integer
        number:
          type: string
        subject:
          type: string
        statusId:
          type: integer
        status:
          type: string
        priorityId:
          type: integer
        priority:
          type: string
        departmentId:
          type: integer
        department:
          type:
            - string
            - 'null'
        topicId:
          type: integer
        topic:
          type:
            - string
            - 'null'
        created:
          type: string
        updated:
          type:
            - string
            - 'null'
        dueDate:
          type:
            - string
            - 'null'
        staffId:
          type:
            - integer
            - 'null'
        staff:
          type:
            - string
            - 'null'
        teamId:
          type:
            - integer
            - 'null'
        team:
          type:
            - string
            - 'null'
        slaId:
          type:
            - integer
            - 'null'
        sla:
          type:
            - string
            - 'null'
        isOverdue:
          type: boolean
        isAnswered:
          type: boolean

    # =========================================================================
    # Statistics
    # =========================================================================

    TicketStats:
      type: object
      properties:
        total:
          type: integer
        open:
          type: integer
        closed:
          type: integer
        overdue:
          type: integer
        by_department:
          type: object
          description: Object keyed by department name (sorted alphabetically)
          additionalProperties:
            $ref: '#/components/schemas/DepartmentStats'
        by_staff:
          type: array
          description: Array sorted alphabetically by staff name
          items:
            $ref: '#/components/schemas/StaffStats'

    DepartmentStats:
      type: object
      properties:
        total:
          type: integer
        open:
          type: integer
        closed:
          type: integer
        overdue:
          type: integer

    StaffStats:
      type: object
      properties:
        staff_id:
          type: integer
        staff_name:
          type: string
        total:
          type: integer
        departments:
          type: object
          additionalProperties:
            type: object
            properties:
              open:
                type: integer
              closed:
                type: integer
              overdue:
                type: integer

    TicketStatus:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          examples:
            - 'Open'
            - 'Closed'
        state:
          type: string
          enum:
            - open
            - closed

    # =========================================================================
    # Attachments
    # =========================================================================

    AttachmentMetadata:
      type: object
      description: Attachment metadata returned in thread entries
      properties:
        id:
          type: integer
          description: Attachment ID (internal)
        file_id:
          type: integer
          description: File ID — use this with the attachment download endpoint
        filename:
          type: string
          description: Original filename
          examples:
            - 'screenshot.png'
            - 'report.pdf'
        size:
          type: integer
          description: File size in bytes
        mime_type:
          type: string
          description: MIME type
          examples:
            - 'image/png'
            - 'application/pdf'
        inline:
          type: boolean
          description: Whether the attachment is inline (embedded in message body)

    AttachmentDownloadResponse:
      type: object
      description: Attachment download response with Base64-encoded content
      required:
        - file_id
        - filename
        - mime_type
        - size
        - content
      properties:
        file_id:
          type: integer
          description: File ID
        filename:
          type: string
          description: Original filename
        mime_type:
          type: string
          description: MIME type
        size:
          type: integer
          description: File size in bytes
        content:
          type: string
          format: byte
          description: Base64-encoded file content

    # =========================================================================
    # Subticket
    # =========================================================================

    SubticketInfo:
      type: object
      description: Compact ticket info used in subticket responses
      properties:
        ticket_id:
          type: integer
        number:
          type: string
        subject:
          type: string
        status:
          type: string

    # =========================================================================
    # Task
    # =========================================================================

    TaskSummary:
      type: object
      description: Task without thread (search results)
      properties:
        id:
          type: integer
        number:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [open, closed]
        isOverdue:
          type: boolean
        departmentId:
          type: integer
        department:
          type: [string, 'null']
        staffId:
          type: [integer, 'null']
        staff:
          type: [string, 'null']
        teamId:
          type: [integer, 'null']
        team:
          type: [string, 'null']
        ticket:
          description: Linked ticket, null for a standalone task
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id:
                  type: integer
                number:
                  type: string
                subject:
                  type: string
        created:
          type: string
        updated:
          type: [string, 'null']
        duedate:
          type: [string, 'null']
        closed:
          type: [string, 'null']

    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/TaskSummary'
        - type: object
          properties:
            thread:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  type:
                    type: string
                    description: M = description, N = internal note, R = update
                  title:
                    type: [string, 'null']
                  poster:
                    type: string
                  timestamp:
                    type: string
                  body:
                    type: string
                  format:
                    type: string
                    description: Body format, e.g. html or text
                  staffId:
                    type: integer
                  staff:
                    type: [string, 'null']
                  attachments:
                    type: array
                    items:
                      type: object

    TaskListResponse:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskSummary'

    CreateTaskRequest:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          description: Limited to the length configured on the task form (default 50)
        description:
          type: string
          maxLength: 65535
        format:
          type: string
          enum: [markdown, html, text]
          default: markdown
          description: Markdown needs the Markdown Support plugin, otherwise the text is kept as plain text
        ticketNumber:
          type: string
          description: Link the task to this ticket
        departmentId:
          type: string
          description: Department ID or name. Required without ticketNumber; defaults to the ticket's department
        staffId:
          type: string
          description: Assign to an agent (ID, username or email)
        teamId:
          type: string
          description: Assign to a team (ID or name)
        dueDate:
          type: string
          description: Future date, "YYYY-MM-DD" (end of day) or "YYYY-MM-DD HH:MM"

    UpdateTaskRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        ticketNumber:
          type: [string, 'null']
          description: Link or move to this ticket; null or "" unlinks
        dueDate:
          type: [string, 'null']
          description: Future date; null clears the due date
        departmentId:
          type: string
          description: Transfer to this department (ID or name)
        staffId:
          type: string
        teamId:
          type: string
        unassign:
          type: boolean
        status:
          type: string
          enum: [open, closed]
        note:
          type: string
          description: Internal note
        noteTitle:
          type: string
          maxLength: 255
          default: API Update
        response:
          type: string
          description: Task update ("Post Update" in the staff UI)
        format:
          type: string
          enum: [markdown, html, text]
          default: markdown
        comments:
          type: string
          description: Reason attached to transfer, assignment and status change
        alert:
          type: boolean
          default: true
          description: Send osTicket's agent alerts for transfer, assignment, note and update

    KbVisibility:
      type: string
      enum: [internal, public, featured]
      description: |
        internal = staff only; public = portal; featured = portal and start
        page. An article shows in the portal only if its category is public
        or featured too.

    KbCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        fullName:
          type: string
          description: Name with parent, e.g. "Prozesse / Intern"
        parentId:
          type: [integer, 'null']
        parent:
          type: [string, 'null']
        visibility:
          $ref: '#/components/schemas/KbVisibility'
        description:
          type: string
          description: HTML
        notes:
          type: string
        articleCount:
          type: integer
        created:
          type: [string, 'null']
        updated:
          type: [string, 'null']

    KbCategoryRequest:
      type: object
      additionalProperties: false
      description: For create, `name` and `description` are required.
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 125
        description:
          type: string
          description: HTML, required by osTicket
        notes:
          type: string
          maxLength: 255
        parentId:
          type: [integer, 'null']
          description: null or 0 = top level
        visibility:
          $ref: '#/components/schemas/KbVisibility'

    KbArticle:
      type: object
      properties:
        id:
          type: integer
        question:
          type: string
        categoryId:
          type: integer
        category:
          type: [string, 'null']
        categoryVisibility:
          $ref: '#/components/schemas/KbVisibility'
        visibility:
          $ref: '#/components/schemas/KbVisibility'
        visibleInPortal:
          type: boolean
        slug:
          type: [string, 'null']
          description: Friendly URL slug, read from the RewriteRules in the root .htaccess (never written)
        publicUrl:
          type: [string, 'null']
          description: <helpdesk URL>/kb/<slug>
        portalUrl:
          type: [string, 'null']
        staffUrl:
          type: [string, 'null']
        created:
          type: [string, 'null']
        updated:
          type: [string, 'null']

    KbArticleDetail:
      allOf:
        - $ref: '#/components/schemas/KbArticle'
        - type: object
          properties:
            answer:
              type: string
              description: HTML
            notes:
              type: string
              description: Internal notes (HTML)
            helpTopics:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string

    KbArticleRequest:
      type: object
      additionalProperties: false
      properties:
        question:
          type: string
          maxLength: 255
          description: Title; HTML tags are stripped
        answer:
          type: string
          description: HTML, sanitized by osTicket (max 65535 bytes)
        categoryId:
          type: integer
        notes:
          type: string
          description: Internal notes (HTML)
        visibility:
          $ref: '#/components/schemas/KbVisibility'
